name: Worker

# Processes the Postgres task queue in your Supabase project (task 71).
# Hourly, because every scheduled run on a private repo costs at least 1 billed minute:
# hourly is about 720 min/month of the free 2,000; every 15 minutes would be about 2,900.
on:
  schedule:
    - cron: "17 * * * *" # minute 17, avoiding the busy top of the hour
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Most tasks to process in this run"
        default: "50"

# Never two workers from this workflow at once; a queued run waits instead of cancelling.
concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Process queued tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      WORKER_MAX_SECONDS: "240"
      WORKER_MAX_TASKS: ${{ inputs.max_tasks || '50' }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::Worker skipped: add SUPABASE_URL, SUPABASE_SECRET_KEY and GEMINI_API_KEY under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run worker
